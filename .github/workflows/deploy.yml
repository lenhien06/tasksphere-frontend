name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub UI

concurrency:
  group: deploy-frontend
  cancel-in-progress: false   # never cancel an in-progress deploy

jobs:
  deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Validate env — no localhost in API URL ────────────────────────
      - name: Safety check — no localhost in .env.production
        run: |
          if [[ -f ".env.production" ]]; then
            API_URL=$(grep "^NEXT_PUBLIC_API_URL=" .env.production | cut -d= -f2- | tr -d '"')
            echo "NEXT_PUBLIC_API_URL=$API_URL"
            if echo "$API_URL" | grep -q "localhost"; then
              echo "::error::.env.production NEXT_PUBLIC_API_URL contains localhost!"
              exit 1
            fi
            echo "Safety check passed."
          else
            echo "::warning::.env.production not found in repo (may be on VPS only — OK)"
          fi

      # ── 3. SSH Deploy ────────────────────────────────────────────────────
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            echo "=== Starting frontend deployment on VPS ==="
            bash /root/deploy-frontend.sh
            echo "=== Done ==="

      # ── 4. Verify frontend is up ─────────────────────────────────────────
      - name: Verify frontend health
        run: |
          echo "Waiting 15s for service to stabilise..."
          sleep 15
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            https://tasksphere.io.vn/images/logo.png || echo "000")
          echo "Frontend returned: $HTTP_STATUS"
          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "::error::Frontend health check failed (HTTP $HTTP_STATUS)."
            exit 1
          fi
          echo "Frontend is live."

      # ── 5. Notify on failure ─────────────────────────────────────────────
      - name: Notify failure
        if: failure()
        run: |
          echo "::error::Frontend deployment FAILED."
          echo "To debug, SSH into VPS and run:"
          echo "  docker logs tasksphere-frontend-tasksphere-webapp-1 --tail 100"
          echo "  tail -100 /var/log/tasksphere-deploy.log"
          echo "  free -h"
          echo "  dmesg -T | tail -100"
          echo "  docker ps -a"
