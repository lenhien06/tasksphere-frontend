name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub UI

concurrency:
  group: deploy-frontend
  cancel-in-progress: false   # never cancel an in-progress deploy

jobs:
  deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Validate env — no localhost in API URL ────────────────────────
      - name: Safety check — no localhost in .env.production
        run: |
          if [[ -f ".env.production" ]]; then
            API_URL=$(grep "^NEXT_PUBLIC_API_URL=" .env.production | cut -d= -f2- | tr -d '"')
            echo "NEXT_PUBLIC_API_URL=$API_URL"
            if echo "$API_URL" | grep -q "localhost"; then
              echo "::error::.env.production NEXT_PUBLIC_API_URL contains localhost!"
              exit 1
            fi
            echo "Safety check passed."
          else
            echo "::warning::.env.production not found in repo (may be on VPS only — OK)"
          fi

      # ── 3. SSH Deploy ────────────────────────────────────────────────────
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            echo "=== Starting frontend deployment on VPS ==="
            bash /root/deploy-frontend.sh
            echo "=== Done ==="

      # ── 4. Verify frontend is up ─────────────────────────────────────────
      - name: Verify frontend health
        run: |
          URL="https://tasksphere.io.vn/images/logo.png"
          MAX_ATTEMPTS=18
          SLEEP_SECONDS=10
          LAST_STATUS="000"

          echo "Waiting for frontend to stabilise..."

          for ATTEMPT in $(seq 1 $MAX_ATTEMPTS); do
            LAST_STATUS=$(curl -sS -L -o /dev/null -w "%{http_code}" \
              --connect-timeout 5 \
              --max-time 15 \
              "$URL" || true)

            if [[ -z "$LAST_STATUS" ]]; then
              LAST_STATUS="000"
            fi

            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS -> HTTP $LAST_STATUS"

            if [[ "$LAST_STATUS" == "200" || "$LAST_STATUS" == "301" || "$LAST_STATUS" == "302" ]]; then
              echo "Frontend is live."
              exit 0
            fi

            if [[ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]]; then
              sleep "$SLEEP_SECONDS"
            fi
          done

          echo "::error::Frontend health check failed after $MAX_ATTEMPTS attempts (last HTTP $LAST_STATUS)."
          exit 1

      # ── 5. Notify on failure ─────────────────────────────────────────────
      - name: Notify failure
        if: failure()
        run: |
          echo "::error::Frontend deployment FAILED."
          echo "To debug, SSH into VPS and run:"
          echo "  docker logs tasksphere-frontend-tasksphere-webapp-1 --tail 100"
          echo "  tail -100 /var/log/tasksphere-deploy.log"
          echo "  free -h"
          echo "  dmesg -T | tail -100"
          echo "  docker ps -a"
