name: tasksphere-frontend

services:
  tasksphere-webapp:
    container_name: tasksphere-frontend-webapp
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    ports:
      - "${WEBAPP_HOST_PORT:-3000}:3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/images/logo.png > /dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - tasksphere-network

networks:
  tasksphere-network:
    driver: bridge
